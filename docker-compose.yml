services:
  uvo:
    build: .
    ports:
      - "8010:8010"
    env_file: .env
    environment:
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8010"
      PORT: "8010"
      DB_DRIVER: "sqlite"
      DB_PATH: "./data/music_bot.db"
      MEDIA_ROOT: "./data/media"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
