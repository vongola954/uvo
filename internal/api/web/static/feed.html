<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UVO — Лента</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/auth.js"></script>
<style>body{background:#050507;color:#f4f4f5;font-family:system-ui}</style>
</head><body class="p-6 max-w-2xl mx-auto">
<a href="/" class="text-emerald-400 text-sm">← Студия</a>
<h1 class="text-2xl font-bold mt-4 mb-6">Лента</h1>
<div id="auth"></div>
<div id="list" class="space-y-3 text-sm text-zinc-400">Загрузка…</div>
<script>
UVO.mountAuthBar(document.getElementById('auth'));
(async () => {
  await UVO.ensureDevToken();
  const el = document.getElementById('list');
  try {
    const res = await UVO.api('/api/feed');
    const d = await res.json();
    if (!res.ok) throw new Error((d.error && d.error.message) || d.error || res.status);
    const posts = d.posts || [];
    el.textContent = '';
    if (!posts.length) { el.textContent = 'Лента пуста.'; return; }
    posts.forEach(p => {
      const tid = p.TrackID || p.track_id;
      const cap = p.Caption || p.caption || '—';
      el.appendChild(UVO.el('div', { className: 'border border-white/10 rounded-xl p-4' }, [
        UVO.el('div', { className: 'text-zinc-500 text-xs', text: 'track #' + tid }),
        UVO.el('div', { className: 'mt-1', text: cap }),
      ]));
    });
  } catch (e) {
    el.textContent = e.message;
  }
})();
</script>
</body></html>
