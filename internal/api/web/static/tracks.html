<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UVO — Треки</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/auth.js"></script>
<style>body{background:#050507;color:#f4f4f5;font-family:system-ui}</style>
</head><body class="p-6 max-w-2xl mx-auto">
<a href="/" class="text-emerald-400 text-sm">← Студия</a>
<h1 class="text-2xl font-bold mt-4 mb-6">Мои треки</h1>
<div id="auth"></div>
<div id="list" class="space-y-3 text-sm text-zinc-400">Загрузка…</div>
<script>
UVO.mountAuthBar(document.getElementById('auth'));
async function setPublic(id, isPublic) {
  const res = await UVO.api('/api/tracks/' + id + '/visibility', {
    method: 'PATCH',
    body: JSON.stringify({ is_public: isPublic }),
  });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    throw new Error((d.error && d.error.message) || res.status);
  }
  load();
}
async function shareFeed(id) {
  const caption = prompt('Подпись для ленты', '') || '';
  const res = await UVO.api('/api/feed', {
    method: 'POST',
    body: JSON.stringify({ track_id: Number(id), caption }),
  });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    alert((d.error && d.error.message) || 'Ошибка');
    return;
  }
  alert('В ленте (трек стал публичным)');
  load();
}
async function load() {
  const el = document.getElementById('list');
  try {
    await UVO.ensureDevToken();
    const res = await UVO.api('/api/tracks');
    const d = await res.json();
    if (!res.ok) throw new Error((d.error && d.error.message) || d.error || res.status);
    const tracks = d.tracks || [];
    el.textContent = '';
    if (!tracks.length) { el.textContent = 'Пока пусто. Создай трек в студии.'; return; }
    tracks.forEach(t => {
      const title = t.Title || t.title || 'Трек';
      const dur = t.Duration || t.duration || '?';
      const id = t.ID || t.id;
      const pub = !!(t.IsPublic || t.is_public);
      const card = UVO.el('div', { className: 'border border-white/10 rounded-xl p-4 space-y-2' }, [
        UVO.el('div', { className: 'font-medium text-white', text: title + ' · ' + dur + 's' }),
        UVO.el('div', { className: 'text-xs ' + (pub ? 'text-emerald-400' : 'text-zinc-500'), text: pub ? 'публичный' : 'приватный' }),
        UVO.el('audio', { className: 'w-full', controls: true, src: '/tracks/' + id + '/play' }),
      ]);
      const actions = UVO.el('div', { className: 'flex flex-wrap gap-2' });
      const btnVis = UVO.el('button', {
        className: 'text-xs px-3 py-1.5 rounded-lg border border-white/10 hover:border-emerald-500',
        text: pub ? 'Сделать приватным' : 'Сделать публичным',
      });
      btnVis.onclick = () => setPublic(id, !pub).catch(e => alert(e.message));
      const btnShare = UVO.el('button', {
        className: 'text-xs px-3 py-1.5 rounded-lg border border-white/10 hover:border-emerald-500',
        text: 'В ленту',
      });
      btnShare.onclick = () => shareFeed(id);
      actions.appendChild(btnVis);
      actions.appendChild(btnShare);
      card.appendChild(actions);
      el.appendChild(card);
    });
  } catch (e) {
    el.textContent = e.message;
  }
}
load();
</script>
</body></html>
