<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UVO — Караоке</title>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/auth.js?v=2.10.8"></script>
<style>
body{background:#050507;color:#f4f4f5;font-family:system-ui}
#lyrics{min-height:8rem;line-height:1.8}
.word-active{color:#34d399;font-weight:700}
</style>
</head><body class="p-6 max-w-3xl mx-auto">
<a href="/tracks.html" class="text-emerald-400 text-sm">← Треки</a>
<h1 class="text-2xl font-bold mt-4 mb-2" id="title">Караоке</h1>
<p class="text-sm text-zinc-500 mb-6">Инструментал + синхрон текста + видео Suno</p>
<div id="auth"></div>
<div class="space-y-4">
  <video id="video" class="w-full rounded-xl border border-white/10 bg-black" playsinline></video>
  <audio id="audio" controls class="w-full"></audio>
  <div id="lyrics" class="text-lg text-zinc-400 p-4 rounded-xl border border-white/10 bg-white/5"></div>
  <p id="status" class="text-xs text-zinc-600"></p>
</div>
<script>
UVO.mountAuthBar(document.getElementById('auth'));
const params = new URLSearchParams(location.search);
const trackId = params.get('id');
let timing = [];

function renderLyrics(t) {
  const el = document.getElementById('lyrics');
  el.textContent = '';
  if (!timing.length) {
    el.textContent = 'Текст без тайминга';
    return;
  }
  timing.forEach((w, i) => {
    const span = document.createElement('span');
    span.textContent = w.word || w.Word || '';
    span.dataset.i = String(i);
    span.className = 'word';
    el.appendChild(span);
  });
}

function tick() {
  const audio = document.getElementById('audio');
  const t = audio.currentTime;
  document.querySelectorAll('#lyrics .word').forEach((span, i) => {
    const w = timing[i] || {};
    const start = w.start_s ?? w.StartS ?? 0;
    const end = w.end_s ?? w.EndS ?? start + 0.4;
    span.classList.toggle('word-active', t >= start && t < end);
  });
}

async function boot() {
  if (!trackId) {
    document.getElementById('status').textContent = 'Укажите ?id=TRACK_ID';
    return;
  }
  await UVO.ensureDevToken();
  document.getElementById('status').textContent = 'Собираем караоке (stems + timing + mp4)…';
  const res = await UVO.api('/api/tracks/' + trackId + '/karaoke', { method: 'POST', body: '{}' });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) {
    document.getElementById('status').textContent = (d.error && d.error.message) || 'Ошибка';
    return;
  }
  const k = d.karaoke || {};
  document.getElementById('title').textContent = k.title || 'Караоке';
  timing = k.timing || [];
  renderLyrics();
  const audio = document.getElementById('audio');
  const video = document.getElementById('video');
  audio.src = k.instrumental_url || k.original_url;
  if (k.video_url) {
    video.src = k.video_url;
    video.muted = true;
    audio.addEventListener('play', () => { video.currentTime = audio.currentTime; video.play().catch(()=>{}); });
    audio.addEventListener('pause', () => video.pause());
    audio.addEventListener('seeked', () => { video.currentTime = audio.currentTime; });
  }
  audio.addEventListener('timeupdate', tick);
  document.getElementById('status').textContent = 'Готово. Пойте под инструментал (−2 кредита).';
}
boot().catch(e => { document.getElementById('status').textContent = e.message; });
</script>
</body></html>
