<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>UVO — Плейлисты</title>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/auth.js?v=2.10.16"></script>
<style>
:root { --bg:#050507; --accent:#34d399; --border:rgba(255,255,255,.08); }
body { background:var(--bg); color:#f4f4f5; font-family:Inter,system-ui,sans-serif; padding-bottom:5.5rem; }
.glass { background:rgba(18,18,22,.72); border:1px solid var(--border); backdrop-filter:blur(20px); border-radius:20px; }
.bottom-nav { position:fixed; left:0; right:0; bottom:0; z-index:60; display:grid; grid-template-columns:repeat(4,1fr);
  gap:2px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:rgba(5,5,7,.92); border-top:1px solid var(--border); }
.bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; border-radius:14px;
  font-size:10px; font-weight:600; color:#71717a; text-decoration:none; }
input, select { background:rgba(0,0,0,.45); border:1px solid var(--border); border-radius:14px; padding:10px 12px; color:#f4f4f5; width:100%; }
</style>
</head><body class="p-5 max-w-2xl mx-auto">
<a href="/?view=hub" class="text-emerald-400 text-sm">← Меню</a>
<h1 class="text-2xl font-bold mt-4 mb-2">Плейлисты</h1>
<p class="text-xs text-zinc-500 mb-5">Создайте плейлист → добавьте треки → сделайте публичным</p>
<div id="auth"></div>
<form id="f" class="glass p-4 space-y-3 mb-6">
  <input id="name" placeholder="Название плейлиста" maxlength="80" required>
  <label class="text-xs text-zinc-400 flex items-center gap-2">
    <input id="pub" type="checkbox" class="w-auto"> сразу публичный
  </label>
  <button type="submit" class="w-full py-3 rounded-xl font-bold bg-emerald-500 text-black">Создать</button>
  <p id="form-status" class="text-xs text-zinc-500"></p>
</form>
<div id="list" class="space-y-4 text-sm text-zinc-400">Загрузка…</div>
<script>
UVO.mountAuthBar(document.getElementById('auth'));
function pidOf(p) { return p.id || p.ID; }
function tidOf(t) { return t.id || t.ID; }
function isPub(x) { return !!(x.is_public || x.IsPublic); }

async function togglePub(id, next) {
  const res = await UVO.api('/api/playlists/' + id + '/visibility', {
    method: 'PATCH', body: JSON.stringify({ is_public: !!next }),
  });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) { alert((d.error && d.error.message) || 'Не удалось сменить видимость'); return; }
  load();
}

async function addTrack(playlistId, trackId) {
  const res = await UVO.api('/api/playlists/' + playlistId + '/tracks', {
    method: 'POST', body: JSON.stringify({ track_id: Number(trackId) }),
  });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((d.error && d.error.message) || 'Не удалось добавить трек');
}

async function loadPlaylistTracks(playlistId) {
  const res = await UVO.api('/api/playlists/' + playlistId + '/tracks');
  const d = await res.json().catch(() => ({}));
  if (!res.ok) return [];
  return d.tracks || [];
}

async function loadMyTracks() {
  const res = await UVO.api('/api/tracks');
  const d = await res.json().catch(() => ({}));
  if (!res.ok) return [];
  return d.tracks || [];
}

async function load() {
  const el = document.getElementById('list');
  try {
    await UVO.ensureDevToken();
    const [plRes, myTracks] = await Promise.all([UVO.api('/api/playlists'), loadMyTracks()]);
    const d = await plRes.json();
    if (!plRes.ok) throw new Error((d.error && d.error.message) || d.error || plRes.status);
    const list = d.playlists || [];
    el.textContent = '';
    if (!list.length) {
      el.innerHTML = '<div class="glass p-6 text-center text-zinc-500">Нет плейлистов — создайте выше.</div>';
      return;
    }
    for (const p of list) {
      const id = pidOf(p);
      const pub = isPub(p);
      const tracks = await loadPlaylistTracks(id);
      const card = UVO.el('div', { className: 'glass p-4 space-y-3' });
      card.appendChild(UVO.el('div', {
        className: 'text-white font-semibold text-base',
        text: (p.name || p.Name || 'Плейлист') + ' · ' + tracks.length + ' трек(ов)',
      }));
      card.appendChild(UVO.el('div', {
        className: 'text-xs ' + (pub ? 'text-emerald-400' : 'text-zinc-500'),
        text: pub ? 'публичный' : 'приватный',
      }));
      const trackList = UVO.el('div', { className: 'space-y-1 text-xs text-zinc-400' });
      if (!tracks.length) trackList.appendChild(UVO.el('div', { text: 'Пока пусто — добавьте трек ниже' }));
      else tracks.forEach((t) => trackList.appendChild(UVO.el('div', { text: '♪ ' + (t.Title || t.title || ('#' + tidOf(t))) })));
      card.appendChild(trackList);

      const row = UVO.el('div', { className: 'flex flex-wrap gap-2 items-center' });
      const sel = document.createElement('select');
      sel.className = 'flex-1 min-w-[10rem] text-sm';
      const opt0 = document.createElement('option');
      opt0.value = '';
      opt0.textContent = myTracks.length ? 'Выберите трек…' : 'Нет своих треков';
      sel.appendChild(opt0);
      const inPl = new Set(tracks.map(tidOf));
      myTracks.forEach((t) => {
        const tid = tidOf(t);
        if (inPl.has(tid)) return;
        const o = document.createElement('option');
        o.value = String(tid);
        o.textContent = t.Title || t.title || ('Трек #' + tid);
        sel.appendChild(o);
      });
      const addBtn = UVO.el('button', {
        type: 'button',
        className: 'text-xs px-3 py-2 rounded-lg bg-emerald-500 text-black font-bold',
        text: 'Добавить',
      });
      addBtn.onclick = async () => {
        if (!sel.value) { alert('Выберите трек'); return; }
        try {
          addBtn.disabled = true;
          await addTrack(id, sel.value);
          load();
        } catch (e) {
          alert(e.message || 'Ошибка');
        } finally { addBtn.disabled = false; }
      };
      const visBtn = UVO.el('button', {
        type: 'button',
        className: 'text-xs px-3 py-2 rounded-lg border border-white/10',
        text: pub ? 'Сделать приватным' : 'Сделать публичным',
      });
      visBtn.onclick = () => togglePub(id, !pub);
      row.appendChild(sel);
      row.appendChild(addBtn);
      row.appendChild(visBtn);
      card.appendChild(row);
      el.appendChild(card);
    }
  } catch (e) {
    el.textContent = e.message || 'Ошибка';
  }
}

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const st = document.getElementById('form-status');
  st.textContent = 'Создаём…';
  try {
    await UVO.ensureDevToken();
    const res = await UVO.api('/api/playlists', {
      method: 'POST',
      body: JSON.stringify({
        name: document.getElementById('name').value.trim(),
        is_public: document.getElementById('pub').checked,
      }),
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((d.error && d.error.message) || 'Не удалось создать');
    document.getElementById('name').value = '';
    document.getElementById('pub').checked = false;
    st.textContent = 'Создано';
    load();
  } catch (err) {
    st.textContent = err.message || 'Ошибка';
    alert(err.message || 'Ошибка');
  }
};
load();
</script>
<nav class="bottom-nav" aria-label="Навигация">
  <a href="/?view=lyrics"><span>✎</span>Стихи</a>
  <a href="/?view=create"><span>♪</span>Создать</a>
  <a href="/tracks.html"><span>☰</span>Треки</a>
  <a href="/?view=balance"><span>◇</span>Баланс</a>
</nav>
</body></html>
