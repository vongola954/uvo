# UVO behind HTTPS — replace uvo.example.com and cert paths
server {
    listen 80;
    server_name uvo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name uvo.example.com;

    # Let's Encrypt or Минцифры certs
    ssl_certificate     /etc/letsencrypt/live/uvo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uvo.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # MAX webhook (must be public HTTPS)
    location /api/max/webhook {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
